name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needs no secrets: the app is built against ci/GoogleService-Info.plist,
  # which contains only fake values for the emulator project.
  build-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('FoodPlanner.xcodeproj/project.pbxproj', '**/Package.resolved') }}

      - name: Use fake Firebase config
        run: cp ci/GoogleService-Info.plist FoodPlanner/GoogleService-Info.plist

      - name: Build and run unit tests
        run: |
          set -o pipefail
          mkdir -p build-output
          xcodebuild test \
            -project FoodPlanner.xcodeproj \
            -scheme FoodPlanner \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:FoodPlannerTests \
            -enableCodeCoverage YES \
            -resultBundlePath build-output/unit.xcresult \
            | tee build-output/build.log

      # SWIFT_TREAT_WARNINGS_AS_ERRORS=YES can't be passed on the command line:
      # it also applies to the Firebase packages and breaks them. Fail on
      # warnings in our own sources instead.
      - name: Fail on warnings in app code
        run: |
          if grep -E "^$GITHUB_WORKSPACE/(FoodPlanner|FoodPlannerTests|FoodPlannerUITests)/.*warning:" build-output/build.log; then
            echo "::error::Compiler warnings in app code"; exit 1
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-xcresult
          path: build-output/unit.xcresult

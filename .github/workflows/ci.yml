name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swift-format lint
        run: make lint

  # Needs no secrets: the app is built against ci/GoogleService-Info.plist,
  # which contains only fake values for the emulator project.
  build-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('FoodPlanner.xcodeproj/project.pbxproj', '**/Package.resolved') }}

      - name: Use fake Firebase config
        run: cp ci/GoogleService-Info.plist FoodPlanner/GoogleService-Info.plist

      - name: Build and run unit tests
        run: |
          set -o pipefail
          mkdir -p build-output
          xcodebuild test \
            -project FoodPlanner.xcodeproj \
            -scheme FoodPlanner \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:FoodPlannerTests \
            -enableCodeCoverage YES \
            -resultBundlePath build-output/unit.xcresult \
            | tee build-output/build.log

      # SWIFT_TREAT_WARNINGS_AS_ERRORS=YES can't be passed on the command line:
      # it also applies to the Firebase packages and breaks them. Fail on
      # warnings in our own sources instead.
      - name: Fail on warnings in app code
        run: |
          if grep -E "^$GITHUB_WORKSPACE/(FoodPlanner|FoodPlannerTests|FoodPlannerUITests)/.*warning:" build-output/build.log; then
            echo "::error::Compiler warnings in app code"; exit 1
          fi

      - name: Coverage ratchet
        run: scripts/check-coverage.sh build-output/unit.xcresult

      - name: Third-party licences are up to date
        run: |
          scripts/generate-third-party-licenses.sh
          git diff --exit-code -- THIRD-PARTY-LICENSES.md FoodPlanner/Resources/Acknowledgements.json \
            || { echo "::error::Run 'make licenses' and commit the result"; exit 1; }

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-xcresult
          path: build-output/unit.xcresult

  # Firestore security rules tests against the emulator (project demo-foodplanner, no credentials).
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run test:emulated

  # Signed-in UI flows against the Auth and Firestore emulators (project demo-foodplanner, no credentials).
  # macOS minutes are scarce, so this runs on pushes to main and on demand rather than on every PR.
  ui:
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Run emulator-backed UI tests
        run: scripts/ui-tests.sh

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-xcresult
          path: build-output/ui-emulated.xcresult
